name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  IMAGE_NAME: hellinger-distance-enrichment

jobs:
  docker-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hellinger-distance-enrichment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: R CMD check inside image
        run: |
          docker run --rm \
            --entrypoint bash \
            hellinger-distance-enrichment:ci \
            -lc "cd /pkg && R -e \"if (!requireNamespace('rcmdcheck', quietly=TRUE)) install.packages('rcmdcheck', repos='https://cloud.r-project.org')\" && R CMD build . && R CMD check --no-manual HellingerDistanceEnrichment_*.tar.gz && R -e \"testthat::test_dir('tests/testthat')\""

      - name: Build pkgdown site
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            --entrypoint bash \
            hellinger-distance-enrichment:ci \
            -lc "R -e \"if (!requireNamespace('pkgdown', quietly=TRUE)) install.packages('pkgdown', repos='https://cloud.r-project.org')\" && R -e \"pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)\""

      - name: Deploy pkgdown to GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
